<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a class="home" href="../index.html">&larr; All apps</a>
    <main>
        <input id="result" type="text" readonly placeholder="0" aria-label="Calculation" aria-live="polite">
        <div id="keys">
            <button class="clear" data-action="clear">C</button>
            <button class="clear" data-action="delete" aria-label="Delete last character">&#9003;</button>
            <button class="divide wide" data-value="/" aria-label="Divide">/</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="multiply" data-value="*" aria-label="Multiply">x</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="minus" data-value="-" aria-label="Subtract">-</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button class="plus" data-value="+" aria-label="Add">+</button>

            <button class="wide" data-value="0">0</button>
            <button data-value=".">.</button>
            <button class="equals" data-action="equals">=</button>
        </div>
    </main>
    <script src="calc.js"></script>
</body>

</html>
