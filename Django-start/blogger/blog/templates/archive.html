<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blog</title>
</head>
<body>
    <h1>Blog</h1>
    <form action="{% url 'create_blogpost' %}" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Post</button>
    </form>
    <hr>
    {% for post in posts %}
    <h2>{{ post.title }}</h2>
    <p><small>{{ post.timestamp }}</small></p>
    <p>{{ post.body|linebreaksbr }}</p>
    <hr>
    {% empty %}
    <p>No posts yet.</p>
    {% endfor %}
</body>
</html>
