<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loan Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a class="home" href="../index.html">&larr; All apps</a>
    <main id="loancal">
        <h1>Loan Calculator</h1>
        <label for="amount">Loan amount ($)</label>
        <input id="amount" type="number" placeholder="Enter the amount" min="1" step="any" inputmode="decimal">

        <label for="rate">Interest rate (% a year)</label>
        <input id="rate" type="number" placeholder="Enter the rate %" min="0" max="100" step="any" value="10" inputmode="decimal">

        <label for="time">Loan time (months)</label>
        <input id="time" type="number" placeholder="Enter the time in months" min="1" max="600" step="1" inputmode="numeric">

        <div role="status">
            <h2 id="pay"></h2>
            <p id="details"></p>
        </div>
    </main>
    <script src="loancalc.js"></script>
</body>

</html>
