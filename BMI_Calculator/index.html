<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a class="home" href="../index.html">&larr; All apps</a>
    <main id="calc">
        <h1>BMI Calculator</h1>
        <form id="bmi" novalidate>
            <label for="height">Height in cm</label>
            <input type="number" id="height" placeholder="Enter height" inputmode="decimal" step="any">

            <label for="weight">Weight in kg</label>
            <input type="number" id="weight" placeholder="Enter weight" inputmode="decimal" step="any">

            <button id="calc_btn" type="submit">Calculate</button>
        </form>
        <p id="result" role="status"></p>
        <div id="guide">
            <h2>BMI Weight Guide (adults)</h2>
            <p>Underweight: below 18.5</p>
            <p>Normal range: 18.5 to 24.9</p>
            <p>Overweight: 25 to 29.9</p>
            <p>Obese: 30 or above</p>
        </div>
    </main>
    <script src="calc.js"></script>
</body>

</html>
