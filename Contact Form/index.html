<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a class="home" href="../index.html">&larr; All apps</a>
    <main>
        <h1>Contact Form</h1>
        <p class="note">Practice form: nothing you type is sent or saved.</p>
        <form id="contact" novalidate>
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Name" autocomplete="name">

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Email" autocomplete="email">

            <label for="phone">Phone</label>
            <input type="tel" id="phone" placeholder="Phone" autocomplete="tel">

            <p id="message" role="status"></p>

            <div class="buttons">
                <button id="send" type="submit">Send</button>
                <button id="clear" type="reset">Clear</button>
            </div>
        </form>
    </main>
    <script src="form.js"></script>
</body>

</html>
